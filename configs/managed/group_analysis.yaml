# 群分析助手受管工作流（Admin 发布内容 = 本文件正文，技术方案 §4）
#
# 流水线：parse_args → fetch(agent 工具循环) → stats → report(流式)
#  - flow_agent 从用户话语提取群名；平台只从当前用户可读的群中解析并绑定 conversation_id；
#  - fetch 无法完成（群找不到等）→ 输出以「无法完成分析」开头 → 路由转反问；
#  - im 不可达等系统故障 → fetch on_error 降级为用户可读提示；
#  - 超量窗口由 fetch agent 在工具循环内分段纪要（state 只留纪要不留原文），
#    引擎零改动（无 map 节点、无 router 循环）。
#  - 引擎无时钟：相对时间（now / now-Nd）记号由 im-tools-mcp 服务端解析。
#
# 受管门禁：仅 agent/llm/template 三类节点；经 load_managed_spec 与
# flowagent check --strict 双重校验（阶段 0 结论，L2 测试固化）。

workflow:
  name: group-analysis
  group_analysis_mode: deterministic
  description: 群分析助手（总结/分类统计/汇报要点）
  start: parse_args
  inputs: [message, history, system_prompt, skills, analysis_target]
  recursion_limit: 25

nodes:
  # ------------------------------------------------------------ 参数解析
  parse_args:
    type: llm
    description: 从对话文本+history 解析目标群、时间窗和分类口径；失败走反问
    system: |
      你是参数解析器，只输出一个 JSON 对象，不输出任何其他文字。
      解析规则：
      1. group_query：提取用户明确说出的群名称或关键词；不推测群名。请求已有目标时填空串。
         group_id：仅当用户明确给出群会话 ID 时填写正整数，否则填 null。最终群 ID 仍由平台核验并绑定。
         用户本轮只补充群名或群 ID 时，可结合此前对话理解分析意图。
      2. start / end：时间范围记号，保持机器可读的原文：
         - 相对：now、now-7d、now-30d（"最近N天/上周"→ start=now-Nd, end=now）；
         - 绝对：YYYY-MM-DD 或 M月D日（用户没说年份就不补年份，服务端会推断）；
         - 未提及则输出空串 ""。
      3. days：用户表达了"N 天"且未给绝对日期时输出整数 N，否则输出 null。
      4. taxonomy_override：用户临时指定的分类口径原文（如"按消息性质分"），
         没有则输出空串 ""。
      5. start/end/days 全部为空串/null 时，工具端默认按最近 7 天处理。
    prompt: |
      此前对话：{history}

      当前用户消息：{message}

      请输出解析结果 JSON，包含 group_query、group_id、start、end、days、taxonomy_override。
    parser: json
    output_key: parsed_args
    mock_response: '{"group_query": "测试群", "group_id": null, "start": "", "end": "", "days": 7, "taxonomy_override": ""}'
    output_schema:
      group_query: {type: string, optional: true}
      group_id: {type: integer, optional: true, min: 1}
      start: {type: string, optional: true}
      end: {type: string, optional: true}
      days: {type: integer, optional: true, min: 1, max: 31}
      taxonomy_override: {type: string, optional: true}
    retries: 1
    timeout: 30
    on_error:
      goto: clarify
      set: {}
    next: fetch_msg

  clarify:
    type: template
    description: 缺群名/解析失败时的反问（本轮结束，等待用户补充后重跑）
    template: |
      请补充分析所需的信息：要分析哪个群（群名称关键词）？时间范围默认最近 7 天，
      如需指定请一并说明（如"9月1日到9月15日"）。
    output_key: reply
    next: END

  # ------------------------------------------------------------ 组装 fetch 任务
  fetch_msg:
    type: template
    description: 组装 fetch agent 的任务消息（覆写 state.message）
    template: |
      请完成群分析的数据准备与分段纪要。

      群会话 ID：{analysis_target.conversation_id}（由平台授权，工具只能读取该 ID）
      时间范围记号：start={parsed_args.start}，end={parsed_args.end}，days={parsed_args.days}
      （记号由工具服务端解析；三者皆空时默认最近 7 天）
      分类口径覆盖（为空则使用默认口径）：{parsed_args.taxonomy_override}
    output_key: message
    next: fetch_sys

  fetch_sys:
    type: template
    description: 组装 fetch agent 的系统提示（工具流程+分段纪要+护栏，覆写 state.system_prompt）
    template: |
      你是群消息分析的数据准备助手，通过工具拉取群消息并产出分段纪要。

      执行流程：
      1. 目标群 conversation_id 已由平台确认，只调用 fetch_group_messages；不要找群、猜测或更换 ID。
      2. 调用 fetch_group_messages 拉取时间窗内消息：首次不带 segment_index（取第 0 段），
         从响应 segment.total 得知总段数；随后可以在同一轮并行调用其余 segment_index
         （一次工具调用循环上限约 8 轮，务必并行取段）。
      3. 每段的 corpus 即该段语料；若 truncated=true 说明该段被截断，纪要中注明。
      4. 汇总各段，输出最终纪要（纯文本，不要包含原始消息全文）：

      【分段纪要】
      分析窗口：<响应中的 window.start ~ window.end>
      分段覆盖：<实际处理第 i..j 段 / 共 total 段；采样时注明采样规则>
      分类计数（默认口径：问题=求助/咨询；通知=公告/安排/结论性告知；讨论=工作话题来回交流；闲聊=非工作寒暄；其他=无法归类）：
      - 问题：N 条，代表：引用 1-2 条原文（保留 [MM-DD HH:mm] 昵称 前缀）
      - 通知：...
      - 讨论：...
      - 闲聊：...
      - 其他：...
      关键事项与结论：<按时间归纳的重要事件/决定/待办>
      覆盖率：实际纳入纪要约 X 条消息，时间覆盖 <起~止>；未覆盖部分及原因

      护栏：
      - 若窗口段数过多无法全部处理，优先均匀采样（如隔段取一）并在「分段覆盖」
        与「覆盖率」中如实声明，绝不能伪造未读数据；
      - 任一工具报错时，最终回复必须以「无法完成分析：」开头并说明原因；
      - 输出绝不包含 sender_id、手机号等内部标识，人名一律用群内昵称。
    output_key: system_prompt
    next: fetch

  fetch:
    type: agent
    description: 受管 MCP 工具循环：按固定 conversation_id 分段 fetch_group_messages → 分段纪要
    output_key: digest
    max_tool_iterations: 8
    timeout: 180
    retries: 1
    retry_delay: 2
    on_error:
      goto: im_unavailable
      set: {}
    next:
      field: digest
      rules:
        - when: {op: contains, value: "无法完成分析"}
          goto: agent_question
      default: stats

  im_unavailable:
    type: template
    description: im/工具链故障的用户可读降级（会话不崩，本轮结束）
    template: |
      抱歉，暂时无法获取群消息（群消息服务不可用或凭据失效）。
      请稍后再试；若持续失败，请联系管理员检查 im-tools-mcp 服务与凭据配置。
    output_key: reply
    next: END

  agent_question:
    type: template
    description: fetch agent 的反问/失败说明直接作为本轮回复
    template: "{digest}"
    output_key: reply
    next: END

  # ------------------------------------------------------------ 分类统计
  stats:
    type: llm
    description: 按口径汇总分类统计（占比+代表引用）；失败不阻断报告
    system: |
      你是数据统计助手。基于分段纪要输出分类统计 JSON，不输出其他文字。
      分类口径：优先采用"用户覆盖口径"；为空时用默认口径
      （问题/通知/讨论/闲聊/其他，定义见纪要）。
      JSON 字段：total_messages（整数，按纪要计数估计）、categories（数组，每项含
      name、count、ratio（如 "23%"）、quotes（1-2 条代表引用原文））、
      override_applied（布尔，是否采用了用户覆盖口径）。
    prompt: |
      分段纪要：
      {digest}

      用户覆盖口径（为空则用默认口径）：{parsed_args.taxonomy_override}

      请输出分类统计 JSON。
    parser: json
    output_key: stats_summary
    mock_response: '{"total_messages": 42, "categories": [{"name": "问题", "count": 12, "ratio": "29%", "quotes": ["[08-01 08:00] 阿明: 上午的任务安排怎么分工"]}], "override_applied": false}'
    retries: 1
    timeout: 60
    on_error:
      goto: report
      set:
        stats_summary: "（分类统计生成失败，本段略过）"
    next: report

  # ------------------------------------------------------------ 最终报告（流式）
  report:
    type: llm
    description: 生成中文 Markdown 报告：总结/分类统计/汇报要点；output_key=reply 流式
    system: |
      你是群分析报告撰写人。基于分段纪要与分类统计，输出中文 Markdown 报告，
      只包含以下三个二级标题段，不添加其他标题与开场白：
      ## 总结 —— 本周期群内发生了什么：事项、讨论、结论；
      ## 分类统计 —— 各类占比与 1-2 条代表消息引用（保留 [MM-DD HH:mm] 昵称 前缀）；
      ## 汇报要点 —— 需要领导/值守者关注的事项：待办、风险、未决问题（条目化）。
      要求：数据只来自纪要与统计，不编造；人名只用群内昵称；
      若纪要声明了采样/截断/覆盖不全，必须在「总结」末尾加一行"⚠ 覆盖率：…"如实声明；
      若统计缺失，用一句话说明后跳过对应条目。
    prompt: |
      分段纪要：
      {digest}

      分类统计：
      {stats_summary}

      分类口径覆盖：{parsed_args.taxonomy_override}

      请输出群分析报告。
    parser: text
    output_key: reply
    mock_response: |
      ## 总结
      本周期群内主要推进了任务分工与发布准备，形成了发布结论。
      ## 分类统计
      - 问题 29%：代表 "[08-01 08:00] 阿明: 上午的任务安排"
      - 通知 24%；讨论 31%；闲聊 10%；其他 6%
      ## 汇报要点
      - 待办：发布前回归验证
      - 风险：附件权限尚未确认
    retries: 1
    timeout: 120
    on_error:
      goto: report_error
      set: {}
    next: END

  report_error:
    type: template
    description: 报告生成失败的用户可读兜底
    template: |
      抱歉，群分析报告生成失败，请稍后重试。此前的消息抓取与统计已完成，
      重试通常可以直接生成报告。
    output_key: reply
    next: END
