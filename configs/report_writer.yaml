# =====================================================================
# 示例：调研报告生成流水线
# 演示能力：JSON 结构化输出 -> 工具检索 -> 撰写 -> 评审打分循环（默认
#          mock 打6分，因此会真实触发两次修订后由循环护栏放行）
# 运行：python -m flowagent run configs/report_writer.yaml --input "{\"topic\": \"智能体框架\"}"
# =====================================================================

workflow:
  name: report_writer
  description: 调研报告生成流水线（规划 → 检索 → 撰写 → 评审循环 → 定稿）
  start: plan
  recursion_limit: 60
  inputs: [topic]

nodes:
  plan:
    type: llm
    description: 制定调研大纲（JSON 结构化输出）
    system: 你是调研规划专家，只输出JSON对象。
    prompt: |
      请为主题「{topic}」制定调研大纲，只输出JSON对象：
      {"title": "报告标题", "points": ["要点1", "要点2", "要点3"]}
    parser: json
    output_key: outline
    mock_response: '{"title": "主题调研报告", "points": ["背景", "现状", "建议"]}'
    next: search

  search:
    type: tool
    description: 知识库检索素材
    tool: flowagent.tools:knowledge_base
    args:
      query: $topic
    output_key: material
    next: draft

  draft:
    type: llm
    description: 按大纲与素材撰写正文
    system: 你是报告撰写专家，直接输出正文。
    prompt: |
      请根据大纲与素材撰写报告正文（300字以内）。
      大纲：{outline}
      素材：{material}
    output_key: draft_text
    mock_response: |
      本报告围绕主题展开。背景方面，需求持续增长；现状方面，生态逐步完善；
      建议方面，建议小步试点、快速迭代。（Mock正文）
    next: review

  review:
    type: llm
    description: 评审打分，低于8分回到 polish 修订（循环）
    system: '你是评审员，只输出JSON对象：{"score": 1到10的整数, "reason": "一句话评审意见"}'
    prompt: 请为以下报告打分（1-10），只输出JSON对象：{draft_text}
    parser: json
    output_key: review
    output_schema:            # LLM 输出强校验（失败关闭）：缺 score/越界都不放行
      score: {type: integer, min: 1, max: 10}
      reason: {type: string}
    mock_response: '{"score": 6, "reason": "素材深度不足，需补充论证"}'
    next:
      field: review.score
      rules:
        - when: {op: lt, value: 8}
          goto: polish
          max_loops: 2
          loop_exhaust: publish
      default: publish

  polish:
    type: llm
    description: 根据评审意见修订正文，回到 review
    system: 你是报告撰写专家，直接输出修订后的正文。
    prompt: |
      请根据评审意见修订报告正文。
      原文：{draft_text}
      评审意见：{review.reason}
    output_key: draft_text
    mock_response: |
      修订版：已补充数据论证与落地建议，论证更充分。（Mock修订正文）
    next: review

  publish:
    type: template
    description: 定稿输出
    template: |
      # {outline.title}
      {draft_text}
      （评审意见：{review.reason}，评分 {review.score}/10）
    output_key: final_report
    next: END
