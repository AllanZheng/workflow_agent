# =====================================================================
# 示例：智能客服工单处理流水线
# 演示能力：LLM 意图分类 -> 条件路由 -> 并行扇出/汇合 -> 质检修订循环
#          -> 循环护栏 -> 模板汇总，以及工具节点 on_error 降级
# 运行：python -m flowagent run configs/customer_service.yaml --input "{\"ticket\": \"商品坏了\"}"
# =====================================================================

workflow:
  name: customer_service
  description: 智能客服工单处理流水线（分类 → 条件路由 → 并行处理 → 质检循环 → 总结）
  start: classify
  recursion_limit: 60
  inputs: [ticket]

nodes:
  # ---------- 1. LLM 意图分类 ----------
  classify:
    type: llm
    description: LLM 将工单分入四类之一，输出到 vars.category
    system: 你是客服工单分类器，只输出类别名称，不要输出任何其他内容。
    prompt: |
      请将下面的客服工单分类，类别只能是：退款、技术、投诉、咨询。
      只输出类别名称。
      工单内容：{ticket}
    parser: classifier
    labels: [退款, 技术, 投诉, 咨询]
    output_key: category
    mock_response: 退款          # 离线 Mock 模式下的固定分类结果
    next:
      field: category            # 条件路由：按 vars.category 分发
      rules:
        - {when: {op: eq, value: 退款}, goto: refund}
        - {when: {op: eq, value: 技术}, goto: diagnose}
        - {when: {op: eq, value: 投诉}, goto: sentiment}
      default: faq

  # ---------- 2a. 退款分支（确定性模板节点） ----------
  refund:
    type: template
    description: 退款处理说明
    template: |
      【退款处理】您的退款申请已受理。依据退货政策，款项将在3-5个工作日内原路退回。
      工单摘要：{ticket}
    output_key: answer
    next: review

  # ---------- 2b. 技术分支（工具节点 + 错误降级） ----------
  diagnose:
    type: tool
    description: 调用知识库工具检索技术方案；工具故障时降级为人工队列
    tool: flowagent.tools:knowledge_base
    args:
      query: $ticket             # $ 前缀表示从状态变量取值
    output_key: answer
    on_error:
      goto: review
      set:
        answer: 自助工具暂不可用，已为您转人工技术支持，请耐心等待。
    next: review

  # ---------- 2c. 投诉分支（LLM 情绪识别 -> 并行扇出） ----------
  sentiment:
    type: llm
    description: 投诉情绪识别，随后并行触发补偿与内部通知
    system: 你是情绪分析器，只输出：负面、中性 或 正面。
    prompt: 判断以下投诉的情绪倾向，只输出 负面/中性/正面 之一：{ticket}
    parser: classifier
    labels: [负面, 中性, 正面]
    output_key: sentiment
    mock_response: 负面
    next: [compensation, notify_team]   # 并行扇出，两个分支都完成后才进入 review

  compensation:
    type: template
    description: 生成补偿方案（并行分支1）
    template: |
      【补偿方案】识别到{sentiment}情绪投诉，已发放50元无门槛优惠券并向客户致歉。
    output_key: answer
    next: review

  notify_team:
    type: template
    description: 通知客服主管（并行分支2）
    template: "【内部通知】高优投诉已登记（情绪：{sentiment}），请客服主管跟进回访。"
    output_key: notify
    next: review

  # ---------- 2d. 咨询分支 ----------
  faq:
    type: template
    description: 常见咨询答复
    template: |
      【咨询答复】感谢您的咨询。常见问题可查阅帮助中心；个性化问题已转人工，
      工单内容：{ticket}
    output_key: answer
    next: review

  # ---------- 3. 质检修订循环（LLM 打分 -> 不达标回炉，最多2次） ----------
  review:
    type: llm
    description: LLM 质检打分（JSON），低于7分回到 revise 修订
    system: '你是质检员，只输出JSON对象：{"score": 1到10的整数, "reason": "一句话理由"}'
    prompt: |
      请为以下客服答复质检打分（1-10），只输出JSON对象。
      原始工单：{ticket}
      答复内容：{answer}
    parser: json
    output_key: review
    output_schema:            # LLM 输出强校验（失败关闭）：缺 score/越界都不放行
      score: {type: integer, min: 1, max: 10}
      reason: {type: string}
    mock_response: '{"score": 9, "reason": "答复完整，质检通过"}'
    next:
      field: review.score
      rules:
        - when: {op: lt, value: 7}
          goto: revise
          max_loops: 2           # 循环护栏：revise 最多执行2次
          loop_exhaust: finalize # 超限后强制进入 finalize，防止死循环
      default: finalize

  revise:
    type: template
    description: 按质检意见修订答复后回到 review
    template: |
      【修订版】{answer}
      （已根据质检意见补充：{review.reason}；如需进一步协助可联系人工客服。）
    output_key: answer
    next: review

  # ---------- 4. 汇总输出 ----------
  finalize:
    type: template
    description: 汇总生成最终答复
    template: |
      ========== 客服处理结果 ==========
      工单类别：{category}
      处理结论：{answer}
      质检意见：{review.reason}（评分 {review.score}/10）
      =================================
    output_key: final_reply
    next: END
