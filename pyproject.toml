[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flowagent"]

[tool.setuptools.dynamic]
# 版本单一来源：flowagent/__init__.py 的 __version__（评审 4.8）
version = {attr = "flowagent.__version__"}

[project]
name = "flowagent"
dynamic = ["version"]
description = "配置驱动的 LangGraph 工作流智能体引擎"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2",
    "langchain-openai>=1.0.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7",
]

[project.scripts]
# 安装后生成 flowagent 命令（README/API 文档已按此引用，评审 4.8）
flowagent = "flowagent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "mcp==2.2.0"]
sqlite = ["langgraph-checkpoint-sqlite>=2.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["flowagent"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
