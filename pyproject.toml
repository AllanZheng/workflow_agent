[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 自动发现 flowagent 全部子包（V3 内核拆分后 core/clients/workflows/adapters 必须分发）。
include = ["flowagent*"]

[tool.setuptools.dynamic]
# 版本单一来源：flowagent/__init__.py 的 __version__（评审 4.8）
version = {attr = "flowagent.__version__"}

[project]
name = "flowagent"
dynamic = ["version"]
description = "配置驱动的 LangGraph 工作流智能体引擎"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary]>=3.2",
    "langchain-openai>=1.0.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7",
]

[project.scripts]
# 安装后生成 flowagent 命令（README/API 文档已按此引用，评审 4.8）
flowagent = "flowagent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "mcp==2.2.0"]
postgres = ["langgraph-checkpoint-postgres>=3.1,<4", "psycopg[binary]>=3.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "installation: 构建/安装验收（显式运行：-m installation）",
  "live: 真实模型/MCP/Skill 调用（显式 opt-in）",
  "db: 需要隔离测试数据库（AGENT_PLATFORM_*_TEST_DATABASE_URL）",
]

[tool.coverage.run]
source = ["flowagent"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
